[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacification"
version = "1.7.0"
description = "Pacification — console SMS/OTP bomber with an editable provider registry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "phonenumbers>=8.13,<9.0",
    "rich>=13.7,<14.0",
]

[project.scripts]
pacification = "pacification.cli:main"

[tool.setuptools]
packages = ["pacification"]

[tool.setuptools.package-data]
pacification = ["providers.json"]
